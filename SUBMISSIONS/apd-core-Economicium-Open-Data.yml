title: Economicium Open Data
homepage: https://github.com/Economicium-stack/economicium-open-data
category: Economics
description: Sixteen economic and financial datasets published as plain CSV, totalling 18,106 rows. The underlying data comes from government and public sources including the Bureau of Labor Statistics, the Federal Reserve (FRED), the US Treasury, the European Central Bank and Eurostat. Coverage includes US CPI monthly back to 1913, CPI by expenditure group, the NBER recession chronology back to 1854, US national debt, ECB daily reference rates, central bank policy rates and the 30-year mortgage rate. Every dataset names its publishing agency, its licence and its retrieval date. No login or API key is required. Files are refreshed weekly from the published source.
